name: 同步 MCU 来源数据

on:
  workflow_dispatch:
  schedule:
    # cmsis-rust-target-db 每周三 03:17 UTC 更新；这里留出两小时。
    - cron: "17 5 * * 3"

permissions:
  contents: write

concurrency:
  group: update-mcu-compat-sources
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GIGADEVICE_ACCEPT_SLA_GD0001: "1"
      GIGADEVICE_ACCEPT_SLA_GD0003: "1"
      GIGADEVICE_ACCEPT_SLA_GD0006: "1"
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 安装来源处理工具
        run: |
          sudo apt-get update
          sudo apt-get install --yes libarchive-tools libdigest-sha-perl poppler-utils

      - name: 恢复并保存来源状态
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            .cache/research
            .cache/tools
            sources/gigadevice
            reports
          key: gd32-pipeline-v2-${{ runner.os }}-${{ github.run_id }}-prepare
          restore-keys: |
            gd32-pipeline-v2-${{ runner.os }}-
            gd32-sources-v1-${{ runner.os }}-

      - name: 更新并锁定来源
        run: scripts/sync-gigadevice-sources.sh --phase prepare

  normalize:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GIGADEVICE_ACCEPT_SLA_GD0001: "1"
      GIGADEVICE_ACCEPT_SLA_GD0003: "1"
      GIGADEVICE_ACCEPT_SLA_GD0006: "1"
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 安装固定 Rust 工具链
        run: |
          rustup toolchain install nightly-2025-12-11 --profile minimal --component rust-src --component rustfmt --component clippy \
            --target riscv32imac-unknown-none-elf \
            --target riscv32imafc-unknown-none-elf \
            --target thumbv7em-none-eabihf \
            --target thumbv7m-none-eabi \
            --target thumbv8m.base-none-eabi \
            --target thumbv8m.main-none-eabihf
          rustup default nightly-2025-12-11

      - name: 安装来源处理工具
        run: |
          sudo apt-get update
          sudo apt-get install --yes libarchive-tools libdigest-sha-perl poppler-utils

      - name: 恢复来源并保存归一状态
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            .cache/research
            .cache/tools
            .cache/generated
            sources/gigadevice
            reports
          key: gd32-pipeline-v2-${{ runner.os }}-${{ github.run_id }}-normalize
          restore-keys: |
            gd32-pipeline-v2-${{ runner.os }}-${{ github.run_id }}-prepare

      - name: 归一并验证 SVD 数据
        run: scripts/sync-gigadevice-sources.sh --phase normalize

  derive:
    needs: normalize
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GIGADEVICE_ACCEPT_SLA_GD0001: "1"
      GIGADEVICE_ACCEPT_SLA_GD0003: "1"
      GIGADEVICE_ACCEPT_SLA_GD0006: "1"
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 安装固定 Rust 工具链
        run: |
          rustup toolchain install nightly-2025-12-11 --profile minimal --component rust-src --component rustfmt --component clippy \
            --target riscv32imac-unknown-none-elf \
            --target riscv32imafc-unknown-none-elf \
            --target thumbv7em-none-eabihf \
            --target thumbv7m-none-eabi \
            --target thumbv8m.base-none-eabi \
            --target thumbv8m.main-none-eabihf
          rustup default nightly-2025-12-11

      - name: 恢复归一状态并保存派生状态
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            .cache/research
            .cache/tools
            .cache/generated
            sources/gigadevice
            reports
          key: gd32-pipeline-v2-${{ runner.os }}-${{ github.run_id }}-derive
          restore-keys: |
            gd32-pipeline-v2-${{ runner.os }}-${{ github.run_id }}-normalize

      - name: 派生并验证原生数据
        run: scripts/sync-gigadevice-sources.sh --phase derive

  update:
    needs: derive
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GIGADEVICE_ACCEPT_SLA_GD0001: "1"
      GIGADEVICE_ACCEPT_SLA_GD0003: "1"
      GIGADEVICE_ACCEPT_SLA_GD0006: "1"
      GENERATED_REPOSITORY_DIR: ${{ github.workspace }}/.cache/generated-repository

    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 检出 generated 仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: itswenb/embassy-mcu-compat-generated
          ssh-key: ${{ secrets.GENERATED_REPO_SSH_KEY }}
          path: .cache/generated-repository
          persist-credentials: true

      - name: 安装固定 Rust 工具链
        run: |
          rustup toolchain install nightly-2025-12-11 --profile minimal --component rust-src --component rustfmt --component clippy \
            --target riscv32imac-unknown-none-elf \
            --target riscv32imafc-unknown-none-elf \
            --target thumbv7em-none-eabihf \
            --target thumbv7m-none-eabi \
            --target thumbv8m.base-none-eabi \
            --target thumbv8m.main-none-eabihf
          rustup default nightly-2025-12-11

      - name: 安装来源处理工具
        run: |
          sudo apt-get update
          sudo apt-get install --yes libarchive-tools libdigest-sha-perl poppler-utils

      - name: 恢复派生状态
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            .cache/research
            .cache/tools
            .cache/generated
            sources/gigadevice
            reports
          key: gd32-pipeline-v2-${{ runner.os }}-${{ github.run_id }}-derive

      - name: 构造 Embassy 投影并发布
        run: scripts/sync-gigadevice-sources.sh --phase publish

      - name: 验证 Rust 原型未回退
        run: scripts/check-rust.sh

      - name: 同步 generated 发布树
        run: |
          if [[ -d .cache/generated/mcu-metapac-publication-v1 ]]; then
            scripts/sync-generated-repository.sh .cache/generated/mcu-metapac-publication-v1 "${GENERATED_REPOSITORY_DIR}"
          else
            echo "来源与流水线均无变化，无需同步 generated 发布树。"
          fi

      - name: 提交来源变化
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- sources/gigadevice reports)" ]]; then
            echo "来源数据没有变化。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- sources/gigadevice reports
          git commit -m "数据：同步 GD32 全量来源快照"

          auth_header="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w 0)"
          trap 'git config --local --unset-all http.https://github.com/.extraheader || true' EXIT
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${auth_header}"
          unset auth_header
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
          git config --local --unset-all http.https://github.com/.extraheader
          trap - EXIT

      - name: 提交 generated 变化
        shell: bash
        run: |
          set -euo pipefail
          generated_repo="${GENERATED_REPOSITORY_DIR}"
          if [[ -z "$(git -C "${generated_repo}" status --porcelain)" ]]; then
            echo "generated 内容没有变化。"
            exit 0
          fi

          git -C "${generated_repo}" config user.name "github-actions[bot]"
          git -C "${generated_repo}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "${generated_repo}" add -A
          git -C "${generated_repo}" commit -m "生成：同步 GD32 全型号 PAC 与 metadata"
          git -C "${generated_repo}" push origin "HEAD:${{ github.event.repository.default_branch }}"

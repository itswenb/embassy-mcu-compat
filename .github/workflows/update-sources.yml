name: 同步 MCU 来源数据

on:
  workflow_dispatch:
  schedule:
    # cmsis-rust-target-db 每周三 03:17 UTC 更新；这里留出两小时。
    - cron: "17 5 * * 3"

permissions:
  contents: write

concurrency:
  group: update-mcu-compat-sources
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CMSIS_TOOLBOX_VERSION: "2.14.1"
      CMSIS_TOOLBOX_SHA256: "c83735c0c1dfd95b2865e908c7adb8cd5d4fd7ec61da96990072d9e77b3e3e25"

    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 安装固定 Rust 工具链
        run: |
          rustup toolchain install nightly-2025-12-11 --profile minimal
          rustup default nightly-2025-12-11

      - name: 安装固定 CMSIS-Toolbox
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/cmsis-toolbox"
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/cmsis-toolbox.tar.gz" \
            "https://github.com/Open-CMSIS-Pack/cmsis-toolbox/releases/download/${CMSIS_TOOLBOX_VERSION}/cmsis-toolbox-linux-amd64.tar.gz"
          printf '%s  %s\n' \
            "${CMSIS_TOOLBOX_SHA256}" \
            "${RUNNER_TEMP}/cmsis-toolbox.tar.gz" \
            | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/cmsis-toolbox.tar.gz" \
            -C "${RUNNER_TEMP}/cmsis-toolbox" \
            --strip-components=1
          chmod -R +x "${RUNNER_TEMP}/cmsis-toolbox/bin"
          echo "${RUNNER_TEMP}/cmsis-toolbox/bin" >> "$GITHUB_PATH"

      - name: 锁定目标数据库最新 commit
        shell: bash
        run: |
          set -euo pipefail
          revision="$(git ls-remote https://github.com/itswenb/cmsis-rust-target-db.git HEAD | awk 'NR == 1 { print $1 }')"
          [[ "${revision}" =~ ^[0-9a-f]{40}$ ]]
          echo "TARGET_DB_REVISION=${revision}" >> "$GITHUB_ENV"

      - name: 更新并校验全部来源
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --release -- sources update \
            --target-db-revision "${TARGET_DB_REVISION}" \
            --cache-dir .cache/sources
          cargo run --locked --release -- audit \
            --update-derived \
            --cache-dir .cache/sources
          cargo run --locked --release -- audit \
            --frozen \
            --cache-dir .cache/sources
          cargo test --locked --all-targets

      - name: 提交来源变化
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- sources.lock.toml reports/inventory.json Cargo.lock)" ]]; then
            echo "来源数据没有变化。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources.lock.toml reports/inventory.json Cargo.lock
          git commit -m "数据：同步 MCU 来源快照"

          auth_header="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w 0)"
          trap 'git config --local --unset-all http.https://github.com/.extraheader || true' EXIT
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${auth_header}"
          unset auth_header
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
          git config --local --unset-all http.https://github.com/.extraheader
          trap - EXIT

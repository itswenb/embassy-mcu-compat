name: 同步 MCU 来源数据

on:
  workflow_dispatch:
  schedule:
    # cmsis-rust-target-db 每周三 03:17 UTC 更新；这里留出两小时。
    - cron: "17 5 * * 3"

permissions:
  contents: write

concurrency:
  group: update-mcu-compat-sources
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GIGADEVICE_ACCEPT_SLA_GD0001: "1"
      GIGADEVICE_ACCEPT_SLA_GD0003: "1"
      GIGADEVICE_ACCEPT_SLA_GD0006: "1"
      GENERATED_REPOSITORY_DIR: ${{ github.workspace }}/.cache/generated-repository

    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 检出 generated 仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: itswenb/embassy-mcu-compat-generated
          ssh-key: ${{ secrets.GENERATED_REPO_SSH_KEY }}
          path: .cache/generated-repository
          persist-credentials: true

      - name: 安装固定 Rust 工具链
        run: |
          rustup toolchain install nightly-2025-12-11 --profile minimal --component rust-src --component rustfmt --component clippy --target riscv32imac-unknown-none-elf --target riscv32imafc-unknown-none-elf
          rustup default nightly-2025-12-11

      - name: 安装来源处理工具
        run: |
          sudo apt-get update
          sudo apt-get install --yes libarchive-tools libdigest-sha-perl poppler-utils

      - name: 恢复项目内来源缓存
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            .cache/research/gigadevice/official-firmware
            .cache/research/gigadevice/firmware-sources-v1
            .cache/research/gigadevice/addons
            .cache/research/gigadevice/addon-packs-v1
            .cache/research/gigadevice/catalog
            .cache/research/gigadevice/manuals
            .cache/research/gigadevice/manual-text-v1
            .cache/research/gigadevice/manual-dma-tsv-v1
            .cache/research/gigadevice/datasheets
            .cache/research/gigadevice/datasheet-text-v1
            .cache/research/gigadevice/tools/*.7z
            .cache/research/gigadevice/builder-resources
            .cache/research/gigadevice/builder-firmware-v1
            .cache/research/gigadevice/builder-firmware-adapter-v1
            .cache/research/gigadevice/builder-firmware-cpp-v1
            .cache/research/gigadevice/programmer-v1
            .cache/research/gigadevice/iar
            .cache/research/gigadevice/iar-device-support-v1
            .cache/research/repos
            .cache/tools/cmsis-rust-target-db-target
            .cache/tools/chiptool-target
            .cache/tools/gigadevice-metapac-validation-target
            .cache/tools/gigadevice-feature-metapac-target
            .cache/research/gigadevice/normalized-svd-v4
            .cache/research/gigadevice/chiptool-svd-v1
            .cache/research/gigadevice/pac-compile-v1
            .cache/research/gigadevice/firmware-cpp-v1
            .cache/research/gigadevice/firmware-svd-v1
            .cache/research/gigadevice/chiptool-firmware-v1
            .cache/research/gigadevice/firmware-pac-compile-v1
            .cache/research/gigadevice/source-cache-ready-v1
          key: gd32-sources-v1-${{ runner.os }}-${{ hashFiles('sources/gigadevice/*.lock.json') }}
          restore-keys: |
            gd32-sources-v1-${{ runner.os }}-

      - name: 同步、锁定并验证全部来源
        run: scripts/sync-gigadevice-sources.sh

      - name: 验证 Rust 原型未回退
        run: scripts/check-rust.sh

      - name: 同步 generated 发布树
        run: |
          if [[ -d .cache/generated/mcu-metapac-publication-v1 ]]; then
            scripts/sync-generated-repository.sh .cache/generated/mcu-metapac-publication-v1 "${GENERATED_REPOSITORY_DIR}"
          else
            echo "来源与流水线均无变化，无需同步 generated 发布树。"
          fi

      - name: 提交来源变化
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- sources/gigadevice reports)" ]]; then
            echo "来源数据没有变化。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- sources/gigadevice reports
          git commit -m "数据：同步 GD32 全量来源快照"

          auth_header="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w 0)"
          trap 'git config --local --unset-all http.https://github.com/.extraheader || true' EXIT
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${auth_header}"
          unset auth_header
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
          git config --local --unset-all http.https://github.com/.extraheader
          trap - EXIT

      - name: 提交 generated 变化
        shell: bash
        run: |
          set -euo pipefail
          generated_repo="${GENERATED_REPOSITORY_DIR}"
          if [[ -z "$(git -C "${generated_repo}" status --porcelain)" ]]; then
            echo "generated 内容没有变化。"
            exit 0
          fi

          git -C "${generated_repo}" config user.name "github-actions[bot]"
          git -C "${generated_repo}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "${generated_repo}" add -A
          git -C "${generated_repo}" commit -m "生成：同步 GD32 全型号 PAC 与 metadata"
          git -C "${generated_repo}" push origin "HEAD:${{ github.event.repository.default_branch }}"
